<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="jatter_welcome.css">
  <link rel="stylesheet" href="jatter_history_import.css">
</head>
<body>
  <div class="fre-container">
    <div class="logo-wrapper">
      <img src="images/import.svg" alt="Jatter Plus" class="mascot-logo" />
    </div>

    <h1 class="fre-title">Import bookmarks and settings</h1>
    <p class="fre-subtitle">Bring your bookmarks, browsing history, and settings with you. Jatter organizes what you've been exploring so you can close tabs without losing your place.</p>

    <!-- Browser Selection Dropdown -->
    <div class="browser-select-container">
      <select id="browserSelect" class="fre-dropdown">
        <option value="" disabled selected>Loading browsers...</option>
      </select>
    </div>

    <div class="actions-wrapper">
      <button id="skipBtn" class="secondary-button">Skip</button>
      <button id="importBtn" class="primary-button">Import</button>
    </div>
  </div>

  <script type="module" src="jatter_history_import.js"></script>
</body>
</html>
