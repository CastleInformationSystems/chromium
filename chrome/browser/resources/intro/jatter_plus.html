<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="jatter_welcome.css">
  <link rel="stylesheet" href="jatter_plus.css">
</head>
<body>
  <div class="fre-container">
    <div class="logo-wrapper">
      <img src="images/jatter_mascot_plus.svg" alt="Jatter Plus" class="mascot-logo" />
    </div>

    <h1 class="fre-title">Get more from Jatter</h1>
    <p class="fre-subtitle">Upgrade to Jatter Plus for unlimited personalized answers, unlimited notes, and access to premium AI models.</p>

    <ul class="fre-feature-list">
      <li>
        <span class="icon">🌐</span> <!-- Globe icon -->
        <span>Learn from unlimited websites</span>
      </li>
      <li>
        <span class="icon">📄</span> <!-- Document icon -->
        <span>Create unlimited notes</span>
      </li>
      <li>
        <span class="icon">✨</span> <!-- Sparkles icon -->
        <span>Use premium AI models</span>
      </li>
      <li>
        <span class="icon">📍</span> <!-- Pin icon -->
        <span>Get richer Maps results with photos and reviews</span>
      </li>
    </ul>

    <div class="actions-wrapper">
      <button id="continueFreeBtn" class="secondary-button">Continue with Free</button>
      <button id="getPlusBtn" class="primary-button">Get Jatter Plus</button>
    </div>
  </div>

  <script type="module" src="jatter_plus.js"></script>
</body>
</html>
