<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="jatter_welcome.css">
</head>
<body>
  <div class="fre-container">
    <div class="logo-wrapper">
      <img src="images/jatter_mascot.svg" alt="Jatter" class="mascot-logo" />
    </div>

    <h1 class="fre-title">Welcome to Jatter</h1>
    <p class="fre-subtitle">The private AI browser.</p>

    <label class="fre-checkbox-label">
      <input type="checkbox" id="defaultBrowserCheckbox" checked />
      <span>Make Jatter the default browser</span>
    </label>

    <div class="actions-wrapper">
      <button id="continueBtn" class="primary-button">
        <span>Continue</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="jatter_welcome.js"></script>
</body>
</html>
